<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Naît-on avec tous nos neurones ?</title>
<style>
:root{
  --bg:#04081c; --bg2:#0a1236; --panel:rgba(255,255,255,.045); --line:rgba(140,190,255,.18);
  --cyan:#22e5ff; --blue:#3b7bff; --violet:#a56bff; --rose:#ff5fa2; --amber:#ffd166;
  --txt:#eaf2ff; --muted:#9db1d8;
  --font:"Nunito","Quicksand",ui-rounded,"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; font-family:var(--font); color:var(--txt); background:var(--bg);
  overflow-x:hidden; line-height:1.6; -webkit-text-size-adjust:100%;
}
body::before{
  content:""; position:fixed; inset:0; z-index:-2; pointer-events:none;
  background:
    radial-gradient(120vw 80vh at 15% -10%, #16205e 0%, transparent 60%),
    radial-gradient(100vw 70vh at 95% 10%, #2a1150 0%, transparent 55%),
    radial-gradient(90vw 70vh at 50% 110%, #07205a 0%, transparent 60%),
    linear-gradient(180deg,#04081c,#060d28 50%,#04081c);
}
#stars{position:fixed; inset:0; z-index:-1; pointer-events:none}

/* ---------- nav ---------- */
.nav{
  position:sticky; top:0; z-index:50; display:flex; gap:12px; align-items:center;
  justify-content:space-between; padding:10px 16px; backdrop-filter:blur(14px);
  background:rgba(4,8,28,.72); border-bottom:1px solid var(--line);
}
.brand{font-weight:800; letter-spacing:.2px; font-size:clamp(13px,2.6vw,17px)}
.brand span{color:var(--cyan); text-shadow:0 0 18px rgba(34,229,255,.6)}
.tabs{display:flex; gap:8px}
.tab{
  font:inherit; font-weight:700; color:var(--txt); background:rgba(255,255,255,.04);
  border:1px solid var(--line); border-radius:999px; padding:7px 14px; cursor:pointer;
  transition:.25s; font-size:14px;
}
.tab:hover{border-color:var(--cyan); box-shadow:0 0 18px rgba(34,229,255,.35)}
.tab.active{background:linear-gradient(90deg,rgba(34,229,255,.25),rgba(165,107,255,.25)); border-color:var(--cyan)}

/* ---------- layout ---------- */
main{display:block}
main[hidden]{display:none}
.wrap{max-width:1000px; margin:0 auto; padding:0 18px}
.hero{min-height:82vh; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding:60px 18px 30px}
.hero h1{
  font-size:clamp(30px,7vw,68px); line-height:1.05; margin:0 0 14px; font-weight:900;
  background:linear-gradient(100deg,#fff,#7ff0ff 40%,#c79bff 75%,#ff9dc7);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 0 26px rgba(34,229,255,.28));
}
.hero p{max-width:620px; color:var(--muted); font-size:clamp(15px,2.4vw,19px)}
.scrollhint{margin-top:26px; color:var(--cyan); font-weight:700; animation:bob 2.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(9px)}}

.block{
  max-width:1000px; margin:0 auto; padding:64px 18px;
  opacity:0; transform:translateY(34px); transition:opacity .8s ease, transform .8s ease;
}
.block.in{opacity:1; transform:none}
.block h2{font-size:clamp(23px,4.4vw,38px); margin:0 0 10px; font-weight:900; letter-spacing:-.5px}
.block p.lead{font-size:clamp(15px,2.3vw,18.5px); color:#dbe6ff; margin:0 0 22px; max-width:760px}
.kicker{font-size:13px; font-weight:800; letter-spacing:2px; text-transform:uppercase; color:var(--cyan); opacity:.85}

.panel{
  background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:18px;
  backdrop-filter:blur(8px); box-shadow:0 20px 60px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.06);
}
.encadre{
  max-width:820px; margin:0 auto; padding:22px 20px; border-radius:20px;
  background:linear-gradient(140deg,rgba(255,209,102,.13),rgba(255,95,162,.10));
  border:1px solid rgba(255,209,102,.4); box-shadow:0 0 44px rgba(255,180,90,.12);
}
.encadre h3{margin:0 0 8px; font-size:clamp(18px,3vw,24px); color:#ffe6a8}
.encadre p{margin:0; color:#fff3dc}

.btn{
  font:inherit; font-weight:800; cursor:pointer; color:#04142a; border:0; border-radius:999px;
  padding:12px 22px; background:linear-gradient(90deg,var(--cyan),#7fb2ff);
  box-shadow:0 0 24px rgba(34,229,255,.45); transition:transform .18s, box-shadow .18s, filter .18s;
}
.btn:hover{transform:translateY(-2px); box-shadow:0 0 40px rgba(34,229,255,.8)}
.btn:active{transform:translateY(0)}
.btn.ghost{
  background:rgba(255,255,255,.05); color:var(--txt); border:1px solid var(--line); box-shadow:none;
}
.btn.ghost:hover{border-color:var(--cyan); box-shadow:0 0 22px rgba(34,229,255,.35)}
.btn[disabled]{opacity:.45; cursor:default; transform:none; box-shadow:none}

/* ---------- counters ---------- */
.duo{display:grid; grid-template-columns:1fr 1fr; gap:16px}
.duo .who{text-align:center; padding:16px 10px}
.duo .headbox{height:190px; display:flex; align-items:flex-end; justify-content:center}
.duo .who h4{margin:6px 0 2px; font-size:18px; letter-spacing:.5px}
.count{
  font-size:clamp(26px,5.6vw,44px); font-weight:900; letter-spacing:-1px;
  color:#fff; text-shadow:0 0 28px rgba(34,229,255,.65);
}
.count small{font-size:14px; font-weight:700; color:var(--muted); display:block; text-shadow:none; letter-spacing:0}

/* ---------- gauge ---------- */
.gauge{margin-top:14px}
.gauge .lab{display:flex; justify-content:space-between; font-size:14px; color:var(--muted); font-weight:700; margin-bottom:6px}
.gauge .lab b{color:var(--rose)}
.gauge .bar{height:13px; border-radius:99px; background:rgba(255,255,255,.08); overflow:hidden; border:1px solid var(--line)}
.gauge .fill{height:100%; width:100%; border-radius:99px; background:linear-gradient(90deg,var(--cyan),var(--rose)); box-shadow:0 0 22px rgba(255,95,162,.7); transform:scaleX(0); transform-origin:left; transition:transform .5s ease}

/* ---------- svg viz ---------- */
.viz{position:relative}
.viz svg{width:100%; height:auto; display:block; touch-action:manipulation}
.hint{font-size:14px; color:var(--muted); text-align:center; margin:10px 0 0}
.edge{stroke:var(--blue); stroke-opacity:.75; stroke-width:1.6; stroke-linecap:round; filter:url(#glow)}
.edge.hidden{opacity:0}
.edge.fade{opacity:0; transition:opacity 1.1s ease}
.node{fill:var(--cyan); filter:url(#glow)}
.spark{stroke:#fff; stroke-width:2.4; stroke-linecap:round; stroke-dasharray:6 200; filter:url(#glow)}

/* --- images réelles cliquables --- */
.hotwrap{position:relative; line-height:0}
.hotwrap img{width:100%; height:auto; display:block}
.hot{position:absolute; transform:translate(-50%,-50%); display:flex; align-items:center; gap:6px;
  background:rgba(4,8,28,.72); border:2px solid var(--cyan); color:var(--txt); border-radius:99px;
  padding:3px 10px 3px 3px; font:inherit; font-size:12.5px; font-weight:800; cursor:pointer;
  backdrop-filter:blur(4px); transition:.2s; white-space:nowrap}
.hot span{width:20px; height:20px; border-radius:99px; background:var(--cyan); color:#04142a;
  display:grid; place-items:center; font-size:12px; font-weight:900; flex:0 0 auto}
.hot em{font-style:normal; display:none}
.hot:hover em, .hot.on em{display:inline}
.hot{padding:3px}
.hot:hover, .hot.on{padding:3px 11px 3px 3px}
.hot:hover em, .hot.on em{display:inline}
.hot{padding:3px}
.hot:hover, .hot.on{padding:3px 10px 3px 3px}
.hot.dash{border-style:dashed; border-color:var(--rose)}
.hot.dash span{background:var(--rose)}
.hot:hover{transform:translate(-50%,-50%) scale(1.06); box-shadow:0 0 18px rgba(34,229,255,.5)}
.hot.on{background:var(--cyan); color:#04142a}
.hot.on span{background:#04142a; color:var(--cyan)}
.hot.dash.on{background:var(--rose)}
.hotdef{margin-top:10px; font-size:14px; color:#d6e2ff; background:rgba(255,255,255,.04);
  border:1px solid var(--line); border-radius:14px; padding:11px 13px; min-height:42px; line-height:1.5}
.credit{margin:6px 0 0; font-size:11.5px; color:var(--muted); font-style:italic}
.tlink{color:var(--cyan); cursor:pointer; text-decoration:none; border-bottom:1px dashed rgba(34,229,255,.6); font-weight:700}
.tlink:hover{color:#fff; border-bottom-style:solid}

/* --- étapes de l'élagage --- */
.etape{background:rgba(255,255,255,.05); border:1px solid var(--line); border-radius:16px; padding:14px 16px; min-height:120px}
.etape b{display:block; font-size:16.5px; margin-bottom:6px; color:var(--cyan)}
.etape p{margin:0; font-size:14.5px; color:#d6e2ff; line-height:1.55}
.dots{display:flex; gap:7px; margin-top:12px}
.dots i{width:9px; height:9px; border-radius:99px; background:rgba(255,255,255,.18); display:block; transition:.25s}
.dots i.on{background:var(--cyan); box-shadow:0 0 10px var(--cyan); width:24px}

/* --- page mots scientifiques --- */
.gloss{padding:36px 18px 20px}
.glosstitle{font-size:clamp(28px,5vw,48px); font-weight:900; margin:0 0 8px;
  color:#fff}
.glossnav{display:flex; flex-wrap:wrap; gap:8px; margin:18px 0 26px}
.gn{font-size:13.5px; font-weight:800; color:var(--txt); background:rgba(255,255,255,.05);
  border:1px solid var(--line); border-radius:99px; padding:8px 14px; text-decoration:none; transition:.2s}
.gn:hover{border-color:var(--cyan); box-shadow:0 0 18px rgba(34,229,255,.3)}
.famsec{margin-bottom:34px; scroll-margin-top:80px}
.famsec h2{font-size:clamp(19px,3vw,26px); margin:0 0 14px; font-weight:900}
.gcards{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:14px}
.gcard{background:rgba(255,255,255,.045); border:1px solid var(--line); border-radius:18px; padding:16px 18px; scroll-margin-top:90px}
.gcard h3{margin:0 0 7px; font-size:18.5px; color:var(--cyan)}
.gcard p{margin:0; font-size:14.5px; color:#d6e2ff; line-height:1.55}
.gwhere{margin-top:9px; font-size:12px; color:var(--muted); font-weight:700}
.gcard.flash{animation:flash 1.6s ease}
@keyframes flash{0%{border-color:var(--cyan); box-shadow:0 0 0 rgba(34,229,255,.6)}
  20%{border-color:var(--cyan); box-shadow:0 0 34px rgba(34,229,255,.55); background:rgba(34,229,255,.1)}
  100%{box-shadow:0 0 0 rgba(34,229,255,0)}}

/* --- explorateur de coupes --- */
.modes{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px}
.mbtn{font:inherit; font-size:13.5px; font-weight:800; color:var(--txt); background:rgba(255,255,255,.05);
  border:1px solid var(--line); border-radius:12px; padding:9px 13px; cursor:pointer; transition:.2s}
.mbtn:hover{border-color:var(--cyan)}
.mbtn.on{background:linear-gradient(90deg,rgba(34,229,255,.26),rgba(165,107,255,.26)); border-color:var(--cyan); color:#fff}
.msub{margin:0 0 12px; font-size:14px; color:var(--muted)}
.duoview{display:grid; grid-template-columns:1fr 1fr; gap:14px; align-items:start}
.duoview.single{grid-template-columns:1fr}
.vpane{min-width:0}
.vtag{font-size:11.5px; font-weight:800; letter-spacing:.7px; text-transform:uppercase; color:var(--muted); margin:0 0 6px 2px}
.vtag.irm{color:#b9b9be}
.vtag.real{color:#e8b9c8}
.rlab{font-family:var(--font); font-size:13px; font-weight:800; fill:#4a3a2a}
.cutrow{display:grid; grid-template-columns:200px 1fr; gap:16px; align-items:center; margin-top:16px}
.sec{background:rgba(3,8,26,.5); border:1px solid var(--line); border-radius:18px; overflow:hidden}
.sec svg, .loc svg{width:100%; height:auto; display:block}
.loc{background:rgba(3,8,26,.5); border:1px solid var(--line); border-radius:16px; padding:6px}
.cuttitle{font-size:11.5px; font-weight:800; letter-spacing:.8px; text-transform:uppercase; color:var(--muted); margin-bottom:2px}

.cutlab{display:flex; justify-content:space-between; font-size:12px; color:var(--muted); font-weight:700; margin-top:-4px}
.photo{position:relative; line-height:0}
.photo img{width:100%; height:auto; display:block; filter:saturate(.92) contrast(1.05) drop-shadow(0 10px 30px rgba(0,0,0,.5))}
.photo svg{position:absolute; inset:0; width:100%; height:100%}
.plab{font-family:var(--font); font-size:21px; font-weight:800; paint-order:stroke; stroke:rgba(4,8,28,.8); stroke-width:5px}
.chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px}
.chip{font:inherit; font-size:13px; font-weight:800; color:var(--txt); background:rgba(255,255,255,.05);
  border:1px solid var(--c); border-radius:99px; padding:7px 13px; cursor:pointer; display:flex; align-items:center; gap:7px; transition:.2s}
.chip i{width:10px; height:10px; border-radius:99px; background:var(--c); display:block}
.chip:hover{background:rgba(255,255,255,.1)}
.chip.off{opacity:.42; border-color:var(--line)}
.chip.off i{background:transparent; border:1.5px solid var(--muted)}
.partdef{margin-top:12px; font-size:14px; color:#d6e2ff; background:rgba(255,255,255,.04);
  border:1px solid var(--line); border-radius:14px; padding:12px 14px; min-height:44px}
@media (max-width:760px){ .duoview{grid-template-columns:1fr} .cutrow{grid-template-columns:140px 1fr; gap:12px} }
.blab text{fill:#9db1d8; font-family:var(--font); font-size:15px; font-weight:800; letter-spacing:.5px}
.motscles{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:12px; margin-top:14px}
.mc{font-size:14px; color:#cfdcff; background:rgba(255,255,255,.04); border:1px solid var(--line); border-radius:14px; padding:11px 14px}
.mc b{color:var(--cyan); display:block; font-size:15px; margin-bottom:2px}
.mc.rose b{color:var(--rose)}
.cards{display:none; grid-template-columns:repeat(auto-fit,minmax(215px,1fr)); gap:14px; margin-top:16px}
.cards.on{display:grid}
.card{
  border-radius:18px; padding:16px; border:1px solid var(--line); background:rgba(255,255,255,.05);
  opacity:0; transform:translateY(16px); transition:.6s;
}
.card.show{opacity:1; transform:none}
.card h4{margin:0 0 6px; font-size:17px}
.card .tag{font-size:12px; font-weight:900; letter-spacing:1.4px; padding:3px 10px; border-radius:99px; display:inline-block; margin-bottom:8px}
.card p{margin:0; font-size:14.5px; color:#d6e2ff}
.card.no{border-color:rgba(255,95,162,.5)} .card.no .tag{background:rgba(255,95,162,.2); color:#ffa8cb}
.card.yes{border-color:rgba(34,229,255,.5)} .card.yes .tag{background:rgba(34,229,255,.18); color:#a5f0ff}
.card.clue{border-color:rgba(255,209,102,.5)} .card.clue .tag{background:rgba(255,209,102,.18); color:#ffdf9b}

/* ---------- quiz ---------- */
.choices{display:flex; flex-wrap:wrap; gap:10px; margin-top:12px}
.choice{
  font:inherit; font-weight:700; cursor:pointer; color:var(--txt); padding:12px 18px; border-radius:14px;
  background:rgba(255,255,255,.05); border:1px solid var(--line); transition:.2s;
}
.choice:hover{border-color:var(--cyan); box-shadow:0 0 20px rgba(34,229,255,.3)}
.choice.picked{background:linear-gradient(90deg,rgba(34,229,255,.28),rgba(165,107,255,.28)); border-color:var(--cyan)}
.choice.good{background:rgba(70,230,160,.25); border-color:#46e6a0}
.choice.bad{background:rgba(255,95,162,.22); border-color:var(--rose)}
.feedback{margin-top:14px; padding:14px 16px; border-radius:16px; border:1px solid var(--line); background:rgba(255,255,255,.05); font-size:15.5px}
.feedback.good{border-color:#46e6a0; background:rgba(70,230,160,.12)}
.feedback.bad{border-color:var(--rose); background:rgba(255,95,162,.12)}
.qcount{font-size:13px; font-weight:800; letter-spacing:1.6px; color:var(--cyan); text-transform:uppercase}
.statement{font-size:clamp(17px,3vw,22px); font-weight:800; margin:8px 0 4px}
.score{font-size:clamp(22px,5vw,34px); font-weight:900; text-align:center; margin:6px 0}

/* ---------- chart ---------- */
.chartwrap{position:relative}
.chartscroll{overflow-x:auto; -webkit-overflow-scrolling:touch}
.chartscroll svg{min-width:680px}
.tip{
  position:absolute; z-index:20; pointer-events:none; max-width:270px; padding:10px 12px; border-radius:14px;
  background:rgba(6,12,38,.96); border:1px solid var(--cyan); box-shadow:0 10px 40px rgba(0,0,0,.6);
  font-size:13.5px; opacity:0; transform:translate(-50%,-112%); transition:opacity .15s;
}
.tip.on{opacity:1}
.tip.below{transform:translate(-50%,14%)}
.tip b{display:block; font-size:15px; margin-bottom:2px}
.tip .meth{display:inline-block; margin:4px 0; font-size:11.5px; font-weight:800; letter-spacing:1px; text-transform:uppercase; color:#04142a; background:var(--cyan); border-radius:99px; padding:2px 9px}
.tip .note{color:var(--muted); font-size:12.5px; line-height:1.45}
.axl{fill:var(--muted); font-size:13px; font-family:var(--font); font-weight:700}
.axt{fill:var(--muted); font-size:13px; font-family:var(--font)}
.grid{stroke:rgba(140,190,255,.12); stroke-width:1}
.peak{stroke:rgba(255,255,255,.35); stroke-width:1.2; stroke-dasharray:4 5}
.peaklab{font-size:12px; font-family:var(--font); font-weight:800}
.serie{fill:none; stroke-width:3; stroke-linecap:round}
.serie.dash{stroke-dasharray:7 6}
.hit{fill:transparent; cursor:pointer}
.legend{display:grid; grid-template-columns:repeat(auto-fit,minmax(235px,1fr)); gap:12px; margin:16px 0 6px}
.legend .it{border-radius:16px; padding:12px 14px; background:rgba(255,255,255,.04); border:1px solid var(--line)}
.legend .ith{display:flex; align-items:center; gap:8px; font-size:15px; font-weight:800; color:var(--c)}
.legend .axe{font-size:11.5px; font-weight:800; letter-spacing:.6px; text-transform:uppercase; color:var(--muted); margin:3px 0 6px}
.legend p{margin:0; font-size:13.2px; color:#cfdcff; line-height:1.5}
.sw{width:16px; height:4px; border-radius:99px}
.ro .t .sw{display:inline-block; margin-right:7px; vertical-align:middle}
.readout{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:10px; margin-top:12px}
.ro{border-radius:14px; padding:11px 13px; background:rgba(255,255,255,.05); border:1px solid var(--line)}
.ro .t{font-size:13px; color:var(--muted); font-weight:800}
.ro .v{font-size:21px; font-weight:900}
.ro .m{font-size:11.5px; font-weight:800; letter-spacing:1px; text-transform:uppercase; opacity:.9}
.ro .n{font-size:12.5px; color:var(--muted); line-height:1.4; margin-top:3px}
/* --- curseur d'âge --- */
.ageslider{position:relative; padding:4px 0 2px}
.slider{-webkit-appearance:none; appearance:none; width:100%; height:30px; margin:0; background:transparent; cursor:pointer; display:block}
.slider:focus{outline:none}
.slider::-webkit-slider-runnable-track{height:12px; border-radius:99px;
  background:linear-gradient(90deg,var(--cyan),var(--violet) calc(var(--p)*100%),rgba(255,255,255,.10) calc(var(--p)*100%));
  border:1px solid var(--line)}
.slider::-moz-range-track{height:12px; border-radius:99px; background:rgba(255,255,255,.10); border:1px solid var(--line)}
.slider::-moz-range-progress{height:12px; border-radius:99px; background:linear-gradient(90deg,var(--cyan),var(--violet))}
.slider::-webkit-slider-thumb{-webkit-appearance:none; width:26px; height:26px; margin-top:-8px; border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#fff,#7ff0ff 45%,#1f8cff);
  border:2px solid rgba(255,255,255,.9); box-shadow:0 0 18px rgba(34,229,255,.85);
  transition:transform .18s cubic-bezier(.22,1,.36,1)}
.slider::-moz-range-thumb{width:24px; height:24px; border-radius:50%; background:radial-gradient(circle at 34% 30%,#fff,#7ff0ff 45%,#1f8cff);
  border:2px solid rgba(255,255,255,.9); box-shadow:0 0 18px rgba(34,229,255,.85)}
.slider:hover::-webkit-slider-thumb{transform:scale(1.14)}
.slider:active::-webkit-slider-thumb{transform:scale(1.26)}
.ticks{position:relative; height:34px; margin-top:2px}
.ticks button{position:absolute; top:0; transform:translateX(-50%); font:inherit; font-size:12px; font-weight:800;
  color:var(--muted); background:none; border:0; padding:6px 5px 0; cursor:pointer; white-space:nowrap; transition:color .2s}
.ticks button::before{content:""; display:block; width:2px; height:7px; border-radius:2px; background:rgba(140,190,255,.35); margin:0 auto 4px; transition:.2s}
.ticks button:hover{color:var(--txt)}
.ticks button.on{color:#fff}
.ticks button.on::before{background:var(--cyan); height:11px; box-shadow:0 0 10px var(--cyan)}
.agebig{text-align:center; font-size:clamp(22px,4.2vw,32px); font-weight:900; color:#fff; text-shadow:0 0 22px rgba(34,229,255,.6); margin-bottom:6px}
.agebig span{display:inline-block; animation:pop .35s cubic-bezier(.22,1,.36,1)}

      vx:(Math.random()-.5)*.13, vy:(Math.random()-.5)*.13,
      a:Math.random()*.5+.25, hue:Math.random()<.22 ? "165,107,255" : "34,229,255"
    }));
  }
  function frame(){
    x.clearRect(0,0,w,h);
    for(const p of ps){
      if(!reduce){ p.x += p.vx; p.y += p.vy; }
      if(p.x<0)p.x=w; if(p.x>w)p.x=0; if(p.y<0)p.y=h; if(p.y>h)p.y=0;
      x.beginPath(); x.arc(p.x,p.y,p.r,0,6.3);
      x.fillStyle = "rgba(" + p.hue + "," + p.a + ")"; x.fill();
    }
    requestAnimationFrame(frame);
  }
  addEventListener("resize", size); size(); frame();
})();

  return {play};

function netLayout(seed, n, W, H){
  const r = rng(seed), nodes = [];
  for(let i=0;i<n;i++){
    const col = i % 5, row = Math.floor(i/5);
    nodes.push({x: 70 + col*(W-140)/4 + (r()-.5)*54, y: 55 + row*(H-110)/Math.max(1,Math.ceil(n/5)-1) + (r()-.5)*44});
  }
  const pairs = [];
  for(let i=0;i<n;i++) for(let j=i+1;j<n;j++){
    const d = Math.hypot(nodes[i].x-nodes[j].x, nodes[i].y-nodes[j].y);
    if(d < 185) pairs.push({i,j,d,k:r()});
  }
  pairs.sort((a,b)=>a.k-b.k);
  return {nodes, pairs};
}
function netSVG(nodes, pairs, W, H, hiddenEdges){
  const e = pairs.map((p,i)=>'<line class="edge'+(hiddenEdges?" hidden":"")+'" data-e="'+i+'" x1="'+nodes[p.i].x.toFixed(1)+'" y1="'+nodes[p.i].y.toFixed(1)+
    '" x2="'+nodes[p.j].x.toFixed(1)+'" y2="'+nodes[p.j].y.toFixed(1)+'"/>').join("");
  const n = nodes.map(o=>'<circle class="node" cx="'+o.x.toFixed(1)+'" cy="'+o.y.toFixed(1)+'" r="6"><animate attributeName="r" values="5.4;7;5.4" dur="'+(2.4+Math.random()*2).toFixed(1)+'s" repeatCount="indefinite"/></circle>').join("");
  return '<svg viewBox="0 0 '+W+' '+H+'">'+defs+'<g data-edges>'+e+'</g><g>'+n+'</g></svg>';
}
function setFill(el, pct, dur){
  if(dur != null) el.style.transition = dur ? "transform " + dur + " ease" : "";
  el.style.transform = "scaleX(" + (pct/100) + ")";
}
function gaugeHTML(leftLab, val){
  return '<div class="gauge"><div class="lab"><span>Synapses</span><b data-g-val>'+val+'</b></div>'+
    '<div class="bar"><div class="fill" data-g-fill></div></div>'+
    '<div class="tiny" data-g-sub style="margin-top:6px">'+leftLab+'</div></div>';
}
function vizGrow(host){
  const W=660,H=330, {nodes,pairs} = netLayout(11, 15, W, H);
  const p = el("div","panel");
  p.innerHTML = '<div class="duoview">'+
      '<div class="vpane"><div class="vtag">Schéma — le réseau qui se construit</div>'+
        '<div class="viz sec">'+netSVG(nodes,pairs,W,H,true)+'</div></div>'+
      '<div class="vpane"><div class="vtag real">Comme en vrai — un neurone au microscope</div>'+
        '<div class="sec">'+paneNeurone()+'</div>'+
        '<p class="tiny" style="margin-top:8px">Dessin d\'après une coloration de Golgi : un seul neurone, ses dendrites qui reçoivent, son axone qui envoie. Dans le schéma à gauche, chaque point est un neurone comme celui-ci.</p></div>'+
    '</div>'+
    '<p class="hint">👆 Clique (ou touche) le réseau pour faire pousser des connexions.</p>'+
    gaugeHTML("Niveau à la naissance (JSON : naissance)","~67 %");
  host.appendChild(p);
  const edges = [...p.querySelectorAll(".edge")], fill = $("[data-g-fill]",p),
        val = $("[data-g-val]",p), sub = $("[data-g-sub]",p), svg = p.querySelector("svg");
  let shown = 0;
  setFill(fill, 67);
  function add(){
    if(shown >= edges.length) return;
    for(let k=0;k<5 && shown<edges.length;k++,shown++){
      const e = edges[shown];
      e.classList.remove("hidden");
      e.style.transition = "opacity .5s"; e.style.opacity = "0";
      requestAnimationFrame(()=> e.style.opacity = "");
      const s = document.createElementNS(SVGNS,"line");
      s.setAttribute("class","spark");
      ["x1","y1","x2","y2"].forEach(a => s.setAttribute(a, e.getAttribute(a)));
      s.setAttribute("stroke-dashoffset","200");
      svg.appendChild(s);
      s.animate([{strokeDashoffset:200},{strokeDashoffset:-40}],{duration:900,easing:"linear"})
       .onfinish = () => s.remove();
    }
    const done = shown / edges.length;
    setFill(fill, 67 + 33*done);
    if(done >= 1){ val.textContent = "~100 %"; sub.textContent = "Maximum atteint (JSON : 1 an)"; }
    else { val.textContent = "…"; sub.textContent = "Le réseau se construit"; }
  }
  svg.style.cursor = "pointer";
  svg.addEventListener("click", add);
  return {play(){}};
}

   « Comme en vrai » — dessins réalistes à côté des schémas
   ===================================================================== */
function realMyelin(){
  const seg = [];
  for(let i=0;i<6;i++){
    const x = 46+i*66;
    seg.push('<g><ellipse cx="'+(x+26)+'" cy="196" rx="30" ry="21" fill="#f2e0d2" stroke="#b98a72" stroke-width="2"/>'+
      '<ellipse cx="'+(x+26)+'" cy="196" rx="22" ry="15" fill="none" stroke="#d9b4a0" stroke-width="1.4" opacity=".8"/>'+
      '<ellipse cx="'+(x+26)+'" cy="196" rx="14" ry="9" fill="none" stroke="#d9b4a0" stroke-width="1.2" opacity=".7"/></g>');
  }
  return '<svg viewBox="0 0 460 380">'+
    '<defs><linearGradient id="tis" x1="0" y1="0" x2="0" y2="1">'+
      '<stop offset="0%" stop-color="#2a1830"/><stop offset="100%" stop-color="#160d1c"/></linearGradient></defs>'+
    '<rect width="460" height="380" fill="url(#tis)"/>'+
    '<g opacity=".25">'+ Array.from({length:14},(_,i)=>{
        const rr = rng(80+i), x = rr()*460, y = rr()*380;
        return '<ellipse cx="'+x.toFixed(0)+'" cy="'+y.toFixed(0)+'" rx="'+(6+rr()*16).toFixed(0)+'" ry="'+(4+rr()*9).toFixed(0)+'" fill="#4a2f55"/>';
      }).join("") +'</g>'+
    // axone
    '<line x1="20" y1="196" x2="444" y2="196" stroke="#e8b9c8" stroke-width="11" stroke-linecap="round"/>'+
    '<line x1="20" y1="196" x2="444" y2="196" stroke="#c98099" stroke-width="4" stroke-linecap="round" opacity=".7"/>'+
    seg.join("")+
    '<g><text x="150" y="122" class="rlab" fill="#f2e0d2">gaine de myéline</text>'+
      '<line x1="150" y1="128" x2="128" y2="172" stroke="#f2e0d2" stroke-width="1" opacity=".7"/>'+
      '<text x="238" y="286" class="rlab" fill="#e8b9c8">nœud de Ranvier</text>'+
      '<line x1="238" y1="278" x2="244" y2="216" stroke="#e8b9c8" stroke-width="1" opacity=".7"/>'+
      '<text x="26" y="330" class="rlab" fill="#e8b9c8">axone (le câble)</text>'+
      '<line x1="60" y1="322" x2="46" y2="212" stroke="#e8b9c8" stroke-width="1" opacity=".7"/></g>'+
    '</svg>';
}

/* ---------- illustrations des encadrés ---------- */
function miniCerveau(x, y, s, col, op){
  return '<g transform="translate('+x+','+y+') scale('+s+')" opacity="'+op+'">'+
    '<path d="'+BRAIN.cerebrum+'" fill="'+col+'" fill-opacity=".18" stroke="'+col+'" stroke-width="7"/>'+
    '<path d="'+BRAIN.cervelet+'" fill="none" stroke="'+col+'" stroke-width="7"/></g>';
}

let hotId = 0;
// src : image (ou HTML libre) ; spots : [{x,y,lab,def,go}] en % de l'image
function hotImg(src, spots, credit, opts){
  opts = opts || {};
  const n = ++hotId;
  const pts = spots.map((s,i) =>
    '<button class="hot'+(s.dash?" dash":"")+'" data-hot="'+n+'" data-i="'+i+'" style="left:'+s.x+'%;top:'+s.y+'%"'+
    ' aria-label="'+s.lab+'"><span>'+(i+1)+'</span><em>'+s.lab+'</em></button>').join("");
  const media = opts.html || '<img src="'+src+'" alt="'+(opts.alt||"")+'">';
  return '<div class="hotwrap" data-hotwrap="'+n+'">'+media+pts+'</div>'+
    (credit ? '<p class="credit">'+credit+'</p>' : "")+
    '<div class="hotdef" data-hotdef="'+n+'">👆 Clique sur un point numéroté de l\'image.</div>'+
    '<script type="application/json" data-hotdata="'+n+'">'+JSON.stringify(spots.map(s=>({lab:s.lab,def:s.def,go:s.go})))+'<\/script>';
}
document.addEventListener("click", e => {
  const b = e.target.closest ? e.target.closest("[data-hot]") : null;
  if(!b) return;
  const n = b.dataset.hot, i = +b.dataset.i;
  const data = JSON.parse(document.querySelector('[data-hotdata="'+n+'"]').textContent);
  const box = document.querySelector('[data-hotdef="'+n+'"]');
  document.querySelectorAll('[data-hot="'+n+'"]').forEach(o => o.classList.toggle("on", o === b));
  const s = data[i];
  box.innerHTML = '<b>'+s.lab+'</b> — '+s.def+
    (s.go ? ' <a class="tlink" data-term="'+s.go+'">→ fiche « '+(GLOSS.find(g=>g.id===s.go)||{mot:s.go}).mot+' »</a>' : "");
});

/* ---------- bloc 3 : comment le tri se fait vraiment ---------- */
function vizTri(host){
  const p = el("div","panel");
  const ETAPES = [
    {t:"1. Deux connexions, une très utilisée, une presque jamais",
     d:"Au départ, le cerveau en a fabriqué beaucoup trop. Celle du haut sert tout le temps, celle du bas presque jamais."},
    {t:"2. L'activité renforce, le silence affaiblit",
     d:"Chaque fois qu'un message passe, la connexion se renforce. Celle qui ne sert pas s'affaiblit peu à peu."},
    {t:"3. La connexion inutile est marquée",
     d:"Le cerveau colle une étiquette chimique sur la connexion affaiblie : c'est un signal « à recycler »."},
    {t:"4. La microglie vient l'avaler",
     d:"Une cellule nettoyeuse, la microglie, se déplace en permanence et tâte les connexions. Quand elle trouve une étiquette, elle avale la connexion."},
    {t:"5. Il reste un réseau plus net",
     d:"Moins de connexions, mais les bonnes : le message circule plus vite et plus sûrement. C'est ça, l'élagage."}
  ];
  let k = 0;
  p.innerHTML = '<div class="duoview">'+
      '<div class="vpane"><div class="vtag real">Comme en vrai — comment le tri se fait</div>'+
        '<div class="sec"><svg viewBox="0 0 460 300" data-tri></svg></div></div>'+
      '<div class="vpane"><div class="vtag">Étape par étape</div>'+
        '<div class="etape" data-et></div>'+
        '<div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap">'+
          '<button class="btn" data-next2>Étape suivante →</button>'+
          '<button class="btn ghost" data-rest>↺ Recommencer</button></div>'+
        '<div class="dots" data-dots></div></div>'+
    '</div>';
  host.appendChild(p);
  const svg = $("[data-tri]",p);
  function draw(){
    const on = k;
    const sig = (y,many) => Array.from({length:many?5:1},(_,i)=>
      '<circle cx="'+(150+i*44)+'" cy="'+y+'" r="5" fill="#fff" opacity=".9"><animate attributeName="cx" values="120;350" dur="'+(1.1+i*.1)+'s" repeatCount="indefinite"/></circle>').join("");
    let g = "";
    // neurone émetteur et récepteurs
    g += '<circle cx="80" cy="150" r="26" fill="rgba(34,229,255,.18)" stroke="#22e5ff" stroke-width="2.5"/>'+
         '<text x="80" y="196" text-anchor="middle" class="axt">neurone</text>';
    // connexion du haut (utilisée)
    const wUp = on >= 1 ? 9 : 5;
    g += '<path d="M106 138 C 200 100 280 96 352 92" fill="none" stroke="#22e5ff" stroke-width="'+wUp+'" stroke-linecap="round" opacity=".9"/>'+
         '<circle cx="380" cy="90" r="22" fill="rgba(34,229,255,.15)" stroke="#22e5ff" stroke-width="2"/>'+
         (on >= 1 ? sig(96,true) : "");
    // connexion du bas (peu utilisée)
    const gone = on >= 4;
    const wDn = on >= 1 ? 2.2 : 5;
    if(!gone){
      g += '<path d="M106 164 C 200 200 280 208 352 214" fill="none" stroke="'+(on>=2?"#ff5fa2":"#3b7bff")+'" stroke-width="'+wDn+'" stroke-linecap="round" opacity="'+(on>=3?.45:.85)+'"'+
        (on>=3?' stroke-dasharray="7 7"':'')+'/>';
      if(on >= 2) g += '<g><circle cx="230" cy="204" r="11" fill="#ff5fa2" opacity=".9"/><text x="230" y="208" text-anchor="middle" fill="#0a1130" style="font-size:12px;font-weight:900">!</text>'+
        '<text x="230" y="238" text-anchor="middle" class="axt" fill="#ff9dc7">étiquette « à recycler »</text></g>';
    }
    g += '<circle cx="380" cy="216" r="22" fill="rgba(59,123,255,.12)" stroke="#3b7bff" stroke-width="2" opacity="'+(gone?.35:1)+'"/>';
    // microglie
    if(on >= 3){
      const mx = on >= 4 ? 230 : 120, my = on >= 4 ? 204 : 268;
      const bras = Array.from({length:7},(_,i)=>{
        const a = i/7*6.283;
        return '<line x1="'+mx+'" y1="'+my+'" x2="'+(mx+Math.cos(a)*24).toFixed(0)+'" y2="'+(my+Math.sin(a)*24).toFixed(0)+'" stroke="#4de3b0" stroke-width="3" stroke-linecap="round"/>';
      }).join("");
      g += '<g opacity=".95" style="transition:all .6s">'+bras+'<circle cx="'+mx+'" cy="'+my+'" r="13" fill="#4de3b0" opacity=".85"/>'+
        '<text x="'+mx+'" y="'+(my+40)+'" text-anchor="middle" class="axt" fill="#8ff0cd">microglie</text></g>';
    }
    if(on >= 4) g += '<text x="230" y="276" text-anchor="middle" class="axt" fill="#8ff0cd">connexion avalée ✔</text>';
    svg.innerHTML = defs + '<g filter="url(#glow)">'+g+'</g>';
    $("[data-et]",p).innerHTML = '<b>'+ETAPES[k].t+'</b><p>'+ETAPES[k].d+'</p>';
    $("[data-dots]",p).innerHTML = ETAPES.map((_,i)=>'<i class="'+(i===k?"on":"")+'"></i>').join("");
    $("[data-next2]",p).textContent = k < ETAPES.length-1 ? "Étape suivante →" : "✔ Terminé";
    $("[data-next2]",p).disabled = k >= ETAPES.length-1;
  }
  $("[data-next2]",p).onclick = () => { if(k < ETAPES.length-1){ k++; draw(); } };
  $("[data-rest]",p).onclick = () => { k = 0; draw(); };
  draw();
  return {play(){}};
}

/* ---------- géométrie : contours plissés ---------- */
function ramp(t,a,b){ const f = .07;
  if(t <= a-f || t >= b+f) return 0;
  if(t < a) return (t-a+f)/f;
  if(t > b) return (b+f-t)/f;
  return 1;
}
// courbe fermée lisse passant par les points (Catmull-Rom -> Bézier)
function spline(P){
  const n = P.length; let d = "M"+P[0][0].toFixed(1)+" "+P[0][1].toFixed(1);
  for(let i=0;i<n;i++){
    const p0=P[(i-1+n)%n], p1=P[i], p2=P[(i+1)%n], p3=P[(i+2)%n];
    d += "C"+(p1[0]+(p2[0]-p0[0])/6).toFixed(1)+" "+(p1[1]+(p2[1]-p0[1])/6).toFixed(1)+
         " "+(p2[0]-(p3[0]-p1[0])/6).toFixed(1)+" "+(p2[1]-(p3[1]-p1[1])/6).toFixed(1)+
         " "+p2[0].toFixed(1)+" "+p2[1].toFixed(1);
  }
  return d+"Z";
}
// échantillonne un contour et le déforme en circonvolutions ; renvoie le tracé + les creux (sillons)
function gyrify(d, amp, seed, cx, cy, n){
  n = n || 96;
  const el = document.createElementNS(SVGNS,"path");
  el.setAttribute("d", d);
  let L = 0;
  try { L = el.getTotalLength(); } catch(e){ return {d:d, sulci:[]}; }
  if(!L) return {d:d, sulci:[]};
  const P = [], W = [];
  for(let i=0;i<n;i++){
    const pt = el.getPointAtLength(i/n*L);
    const u = i/n*2*Math.PI;
    const w = Math.sin(u*9+seed)*.5 + Math.sin(u*15+seed*1.7)*.32 + Math.sin(u*23+seed*2.3)*.18;
    let vx = pt.x-cx, vy = pt.y-cy; const m = Math.hypot(vx,vy)||1; vx/=m; vy/=m;
    P.push([pt.x+vx*amp*w, pt.y+vy*amp*w]); W.push(w);
  }
  // sillons : on rentre suivant la normale locale, pas suivant le centre
  const sulci = [];
  for(let i=0;i<n;i++){
    if(W[i] >= -.42) continue;
    const a = P[(i-1+n)%n], b = P[(i+1)%n], c = P[i];
    let nx = -(b[1]-a[1]), ny = b[0]-a[0];
    const m = Math.hypot(nx,ny)||1; nx/=m; ny/=m;
    if(nx*(cx-c[0]) + ny*(cy-c[1]) < 0){ nx = -nx; ny = -ny; }
    sulci.push([c[0], c[1], nx, ny, 10+Math.abs(W[i])*17]);
  }
  return {d:spline(P), sulci};
}
// contour réduit vers le centre (limite substance grise / substance blanche)
function shrink(d, cx, cy, k){
  return {t:"translate("+(cx*(1-k)).toFixed(1)+","+(cy*(1-k)).toFixed(1)+") scale("+k+")", d:d};
}

/* ---------- rendu : deux styles pour la même géométrie ---------- */
const STYLE = {
  schema:{
    bg:"", cortex:"#a56bff", cortexW:13, cortexIn:"#c79bff", blanche:"#ffd166", blancheA:.15,
    fissure:"#8fb0ff", sulci:"#c79bff", sulciA:.55,
    col:{calleux:"#22e5ff", ventricules:"#3b7bff", noyaux:"#c79bff", hippocampe:"#ff5fa2", cervelet:"#4de3b0"},
    glow:true
  },
  irm:{
    bg:"#08080b", cortex:"#8b8b92", cortexW:13, cortexIn:"#9b9ba2", blanche:"#d6d6da", blancheA:1,
    fissure:"#3a3a40", sulci:"#5c5c63", sulciA:.9,
    col:{calleux:"#eaeaee", ventricules:"#141418", noyaux:"#a9a9b0", hippocampe:"#9b9ba2", cervelet:"#c2c2c8"},
    glow:false
  }
};
function paintSection(sec, st, on, gy){
  const P = STYLE[st], full = st === "irm";
  const vis = id => full || on.has(id);
  const tr = sec.baseTr ? ' transform="'+sec.baseTr+'"' : "";
  let g = "";
  // sur l'IRM : cuir chevelu, crâne et liquide autour du cerveau
  if(full){
    const ring = (k,col,w,o) => '<path d="'+gy.d+'" fill="none" stroke="'+col+'" stroke-width="'+w+'" opacity="'+o+'"'+
      ' transform="'+(sec.baseTr ? sec.baseTr+" " : "")+'translate('+(sec.cx*(1-k)).toFixed(1)+','+(sec.cy*(1-k)).toFixed(1)+') scale('+k+')"/>';
    g += ring(1.16,"#c9c4b4",7,.85) + ring(1.11,"#17171b",9,.95) + ring(1.06,"#2a2a30",5,.8);
  }
  // substance blanche puis ruban de cortex
  if(vis("blanche")) g += '<path d="'+gy.d+'" fill="'+P.blanche+'" opacity="'+P.blancheA+'"'+tr+'/>';
  if(vis("cortex")){
    g += '<path d="'+gy.d+'" fill="none" stroke="'+P.cortex+'" stroke-width="'+P.cortexW+'" stroke-linejoin="round" opacity="'+(full?1:.9)+'"'+tr+'/>';
    g += '<path d="'+gy.d+'" fill="none" stroke="'+P.cortexIn+'" stroke-width="2" opacity="'+(full?.8:.9)+'"'+tr+'/>';
    const seg = s => "M"+s[0].toFixed(1)+" "+s[1].toFixed(1)+" L"+(s[0]+s[2]*s[4]).toFixed(1)+" "+(s[1]+s[3]*s[4]).toFixed(1);
    g += gy.sulci.map(s => '<path d="'+seg(s)+'" stroke="'+P.sulci+'" stroke-width="'+(full?8:7)+'" stroke-linecap="round" opacity="'+P.sulciA+'" fill="none"'+tr+'/>').join("");
    // la fente du sillon elle-même (liquide) : trait fin plus sombre
    g += gy.sulci.map(s => '<path d="'+seg(s)+'" stroke="'+P.fissure+'" stroke-width="1.8" stroke-linecap="round" opacity="'+(full?.95:.55)+'" fill="none"'+tr+'/>').join("");
  }
  sec.S.forEach(o => {
    if(o.part === "fissure"){
      g += '<path d="'+o.d+'" fill="none" stroke="'+P.fissure+'" stroke-width="'+o.w+'" stroke-linecap="round" opacity="'+(full?1:.5)+'"'+(o.tr?' transform="'+o.tr+'"':"")+'/>';
      return;
    }
    if(!vis(o.part)) return;
    const c = P.col[o.part] || P.cortex;
    const one = o.kind === "fill"
      ? '<path d="'+o.d+'" fill="'+c+'" opacity="'+(full?1:o.a*.95).toFixed(2)+'"/>'
      : '<path d="'+o.d+'" fill="none" stroke="'+c+'" stroke-width="'+o.w+'" stroke-linecap="round" stroke-linejoin="round" opacity="'+(full?1:o.a).toFixed(2)+'"/>';
    const inner = o.mirror ? one + '<g transform="translate('+(2*o.mirror)+',0) scale(-1,1)">'+one+'</g>' : one;
    g += o.tr ? '<g transform="'+o.tr+'">'+inner+'</g>' : inner;
  });
  return g;
}

    draw();

function vizChart(host){
  const P = DATA.points, W=900, H=520, M={t:52,r:74,b:70,l:64};
  const iw = W-M.l-M.r, ih = H-M.t-M.b, LM = Math.log(81);
  const x = a => M.l + Math.log(a+1)/LM*iw;
  const yL = v => M.t + (1 - v/25)*ih;
  const yR = v => M.t + (1 - v/100)*ih;
  const S = DATA.series.map(s => ({...s, y: s.axe === "gauche" ? yL : yR, col: COL[s.cle]}));
  const mid = c => c.range ? (c.range[0]+c.range[1])/2 : c.valeur;

  let g = "";
  // grille + axes
  for(let v=0; v<=100; v+=25){
    g += '<line class="grid" x1="'+M.l+'" y1="'+yR(v)+'" x2="'+(W-M.r)+'" y2="'+yR(v)+'"/>'+
         '<text class="axt" x="'+(W-M.r+10)+'" y="'+(yR(v)+4)+'">'+v+'</text>';
  }
  for(let v=0; v<=25; v+=5){
    g += '<text class="axt" text-anchor="end" x="'+(M.l-10)+'" y="'+(yL(v)+4)+'">'+v+'</text>';
  }
  g += '<text class="axl" text-anchor="middle" transform="translate(16,'+(M.t+ih/2)+') rotate(-90)">milliards de neurones</text>';
  g += '<text class="axl" text-anchor="middle" transform="translate('+(W-12)+','+(M.t+ih/2)+') rotate(90)">% du maximum</text>';
  g += '<line class="grid" x1="'+M.l+'" y1="'+(M.t+ih)+'" x2="'+(W-M.r)+'" y2="'+(M.t+ih)+'"/>';
  P.forEach(p => {
    g += '<line class="grid" x1="'+x(p.age)+'" y1="'+(M.t+ih)+'" x2="'+x(p.age)+'" y2="'+(M.t+ih+6)+'"/>'+
         '<text class="axt" text-anchor="middle" x="'+x(p.age)+'" y="'+(M.t+ih+24)+'">'+p.label_court+'</text>';
  });
  g += '<text class="axl" text-anchor="middle" x="'+(M.l+iw/2)+'" y="'+(M.t+ih+50)+'">âge (ans) — échelle logarithmique en âge + 1, pour voir la petite enfance</text>';

  // pics
  const pb = DATA.pics.find(p => p.age_debut);
  g += '<rect x="'+x(pb.age_debut)+'" y="'+M.t+'" width="'+(x(pb.age_fin)-x(pb.age_debut))+'" height="'+ih+'" fill="rgba(255,95,162,.10)"/>'+
       '<text class="peaklab" fill="#ff9dc7" text-anchor="middle" x="'+((x(pb.age_debut)+x(pb.age_fin))/2)+'" y="'+(M.t-22)+'">'+pb.label+'</text>';
  DATA.pics.filter(p => p.age).forEach((p,i) => {
    g += '<line class="peak" x1="'+x(p.age)+'" y1="'+M.t+'" x2="'+x(p.age)+'" y2="'+(M.t+ih)+'"/>'+
         '<text class="peaklab" fill="'+COL[p.cle]+'" text-anchor="middle" x="'+x(p.age)+'" y="'+(M.t-(i?22:6))+'">'+p.label+'</text>';
  });

  // courbes
  let hits = "";
  S.forEach(s => {
    for(let i=0;i<P.length-1;i++){
      const a = P[i][s.cle], b = P[i+1][s.cle];
      const dash = (a.range || b.range) ? " dash" : "";
      const co = '" x1="'+x(P[i].age)+'" y1="'+s.y(mid(a))+'" x2="'+x(P[i+1].age)+'" y2="'+s.y(mid(b))+'"/>';
      // halo + trait : pas de filtre SVG, il disparaît sur les segments parfaitement horizontaux
      g += '<line class="serie'+dash+'" stroke-width="10" opacity=".22" stroke="'+s.col+co+
           '<line class="serie'+dash+'" stroke="'+s.col+co;
    }
    P.forEach((p,i) => {
      const c = p[s.cle], X = x(p.age);
      if(c.range){
        g += '<line stroke="'+s.col+'" stroke-width="16" opacity=".22" stroke-linecap="round" x1="'+X+'" y1="'+s.y(c.range[0])+'" x2="'+X+'" y2="'+s.y(c.range[1])+'"/>'+
             '<line stroke="'+s.col+'" stroke-width="7" stroke-linecap="round" x1="'+X+'" y1="'+s.y(c.range[0])+'" x2="'+X+'" y2="'+s.y(c.range[1])+'"/>'+
             '<line stroke="'+s.col+'" stroke-width="3" x1="'+(X-9)+'" y1="'+s.y(c.range[0])+'" x2="'+(X+9)+'" y2="'+s.y(c.range[0])+'"/>'+
             '<line stroke="'+s.col+'" stroke-width="3" x1="'+(X-9)+'" y1="'+s.y(c.range[1])+'" x2="'+(X+9)+'" y2="'+s.y(c.range[1])+'"/>';
        hits += '<rect class="hit" data-s="'+s.cle+'" data-i="'+i+'" x="'+(X-14)+'" y="'+(s.y(c.range[1])-10)+'" width="28" height="'+(s.y(c.range[0])-s.y(c.range[1])+20)+'"/>';
      } else {
        g += '<circle fill="'+s.col+'" filter="url(#glow)" cx="'+X+'" cy="'+s.y(c.valeur)+'" r="5.5"/>';
        hits += '<circle class="hit" data-s="'+s.cle+'" data-i="'+i+'" cx="'+X+'" cy="'+s.y(c.valeur)+'" r="15"/>';
      }
    });
  });
  // repère de l'âge choisi
  g += '<line data-cursor stroke="#fff" stroke-width="1.6" opacity=".55" stroke-dasharray="3 5" x1="'+x(0)+'" y1="'+M.t+'" x2="'+x(0)+'" y2="'+(M.t+ih)+'"/>';
  S.forEach(s => g += '<circle data-halo="'+s.cle+'" cx="'+x(0)+'" cy="'+s.y(mid(P[0][s.cle]))+'" r="11" fill="none" stroke="'+s.col+'" stroke-width="2.5" opacity=".9"/>');

  const p = el("div","panel");
  p.innerHTML =
    '<div class="chartwrap"><div class="chartscroll"><svg viewBox="0 0 '+W+' '+H+'">'+defs+g+hits+'</svg></div>'+
      '<div class="tip" data-tip></div></div>'+
    '<p class="scrollhintx">↔ fais glisser le graphique pour voir toute la vie</p>'+
    '<div class="legend">'+ S.map(s=>'<div class="it" style="--c:'+s.col+'">'+
      '<div class="ith"><span class="sw" style="background:'+s.col+'"></span>'+s.label+'</div>'+
      '<div class="axe">'+(s.axe==="gauche"?"axe de gauche · en milliards":"axe de droite · en % du maximum")+'</div>'+
      '<p>'+DEF[s.cle]+' '+tw(GKEY[s.cle],'→ fiche')+'</p></div>').join("") +'</div>'+
    '<p class="tiny">~ = estimation ; survole un point pour voir d\'où vient le chiffre (ou touche-le sur téléphone). Barre verticale = fourchette ; le trait pointillé la traverse.</p>'+
    '<div class="flatnote"><span class="dot"></span><span>Les petites différences (19,8 → 22) viennent d\'études différentes sur des personnes différentes, pas d\'une vraie augmentation.</span></div>'+
    '<div style="margin-top:18px">'+
      '<div class="agebig" data-age><span>Naissance</span></div>'+
      '<div class="ageslider">'+
        '<input class="slider" type="range" min="0" max="'+(P.length-1)+'" step="1" value="0" style="--p:0" data-slider aria-label="âge">'+
        '<div class="ticks">'+ P.map((pt,i)=>'<button data-jump="'+i+'" style="left:calc(13px + (100% - 26px) * '+(i/(P.length-1)).toFixed(4)+')">'+pt.label_court+'</button>').join("") +'</div>'+
      '</div>'+
      '<div class="readout" data-ro></div>'+
    '</div>';
  host.appendChild(p);

  const tip = $("[data-tip]",p), wrap = $(".chartwrap",p), cursor = $("[data-cursor]",p);
  function showTip(sKey, i, ev){
    const s = S.find(o=>o.cle===sKey), c = P[i][sKey];
    tip.innerHTML = '<b style="color:'+s.col+'">'+s.label+' — '+P[i].label+'</b>'+
      '<div style="font-size:18px;font-weight:900">'+cellText(c, s.unite)+'</div>'+
      '<span class="meth" style="background:'+s.col+'">'+c.method+'</span>'+
      '<div class="note">'+c.note+'</div>';
    const r = wrap.getBoundingClientRect();
    tip.style.left = Math.max(90, Math.min(r.width-90, ev.clientX - r.left)) + "px";
    const ty = ev.clientY - r.top;
    tip.style.top = ty + "px";
    tip.classList.toggle("below", ty < 150);
    tip.classList.add("on");
  }
  p.querySelectorAll(".hit").forEach(h => {
    const f = ev => showTip(h.dataset.s, +h.dataset.i, ev);
    h.addEventListener("pointerenter", f);
    h.addEventListener("pointerdown", f);
  });
  wrap.addEventListener("pointerleave", () => tip.classList.remove("on"));
  $(".chartscroll",p).addEventListener("pointerdown", ev => { if(!ev.target.classList.contains("hit")) tip.classList.remove("on"); });

  const ro = $("[data-ro]",p), ageLab = $("[data-age]",p);
  function render(i){
    const pt = P[i];
    ageLab.innerHTML = "<span>" + pt.label + "</span>";
    cursor.setAttribute("x1", x(pt.age)); cursor.setAttribute("x2", x(pt.age));
    S.forEach(s => {
      const h = p.querySelector('[data-halo="'+s.cle+'"]');
      h.setAttribute("cx", x(pt.age)); h.setAttribute("cy", s.y(mid(pt[s.cle])));
    });
    ro.innerHTML = S.map(s => {
      const c = pt[s.cle];
      return '<div class="ro">'+
        '<div class="t"><span class="sw" style="background:'+s.col+'"></span>'+s.label+'</div>'+
        '<div class="v" style="color:'+s.col+'">'+cellText(c, s.unite)+'</div>'+
        '<div class="m" style="color:'+s.col+'">'+c.method+'</div>'+
        '<div class="n">'+c.note+'</div></div>';
    }).join("");
  }
  const sl = $("[data-slider]",p), ticks = [...p.querySelectorAll("[data-jump]")];
  function go(i){
    sl.value = i;
    sl.style.setProperty("--p", i/(P.length-1));
    ticks.forEach((b,n) => b.classList.toggle("on", n === i));
    render(i);
  }
  sl.addEventListener("input", () => go(+sl.value));
  ticks.forEach(b => b.onclick = () => go(+b.dataset.jump));
  go(0);
  return {play(){}};
}

function buildBloc(def, variant){
  const root = el(variant === "slide" ? "div" : "section", variant === "slide" ? "slide-body" : "block");
  if(variant !== "slide") root.id = def.id;
  const inner = el("div","");
  if(def.kicker) inner.appendChild(el("div","kicker",def.kicker));
  inner.appendChild(el("h2",null,def.titre));
  if(def.texte){
    if(def.encadre){
      const e = el("div","encadre");
      e.appendChild(el("p",null,def.texte));
      inner.appendChild(e);
    } else inner.appendChild(el("p","lead",def.texte));
  }
  root.appendChild(inner);
  const host = el("div","");
  root.appendChild(host);
  const plays = [];
  if(def.viz) plays.push(def.viz(host));
  if(def.reveal){
    const rb = el("div","");
    rb.style.marginTop = "18px";
    root.appendChild(rb);
    revealBox(rb);
  }
  root._play = () => plays.forEach(p => p && p.play && p.play());
  return root;
}

   ===================================================================== */
(function explorer(){
  const m = $("#page-explorer");
  const hero = el("section","hero");
  hero.innerHTML = '<h1>Naît-on avec<br>tous nos neurones&nbsp;?</h1>'+
    '<p>Un voyage lumineux dans le cerveau, de la naissance à 80 ans — avec de vrais chiffres, et l\'endroit exact d\'où ils viennent.</p>'+
    '<div class="scrollhint">↓ descends pour explorer</div>';
  m.appendChild(hero);
  BLOCS.forEach(def => m.appendChild(buildBloc(def, "block")));
  updateReveals();

  const io = new IntersectionObserver(es => es.forEach(e => {
    if(e.isIntersecting){ e.target.classList.add("in"); if(e.target._play) e.target._play(); }
  }), {threshold:.14});
  m.querySelectorAll(".block").forEach(b => io.observe(b));
})();

/* =====================================================================
   PAGE 2 — PRÉSENTATION
   ===================================================================== */
(function deck(){
  const m = $("#page-presentation");
  m.innerHTML = '<div class="deck"><div class="stage" data-stage></div>'+
    '<div class="deckbar">'+
      '<button class="btn ghost" data-prev aria-label="diapo précédente">←</button>'+
      '<span class="progress" data-prog></span>'+
      '<button class="btn" data-next aria-label="diapo suivante">→</button>'+
      '<button class="btn ghost" data-fs>⛶ Plein écran</button>'+
    '</div>'+
    '<div class="deckprog"><span data-bar></span></div></div>';
  const stage = $("[data-stage]",m), prog = $("[data-prog]",m), bar = $("[data-bar]",m);
  const SLIDES = [{id:"intro", titre:"Naît-on avec tous nos neurones ?", kicker:"Introduction",
    texte:"Un bébé fabrique-t-il ses neurones en grandissant ? On va suivre quatre courbes de la naissance à 80 ans : les neurones du cortex, les synapses, la substance grise et la substance blanche."}]
    .concat(BLOCS)
    .concat([{id:"fin", kicker:"Pour finir", titre:"🎯 " + T.t6,
      texte:"Merci ! Toutes les sources sont en bas de la page « Explorer »."}]);

  const built = [];
  let cur = 0;
  function show(i){
    const from = cur;
    cur = (i + SLIDES.length) % SLIDES.length;
    if(!built[cur]){
      const s = el("div","slide");
      s.appendChild(buildBloc(SLIDES[cur], "slide"));
      stage.appendChild(s);
      built[cur] = s;
      updateReveals();
    }
    [...stage.children].forEach(c => c.classList.remove("on","back"));
    built[cur].classList.add("on");
    if(cur < from) built[cur].classList.add("back");
    const body = built[cur].querySelector(".slide-body");
    if(body && body._play) body._play();
    prog.textContent = (cur+1) + " / " + SLIDES.length;
    bar.style.transform = "scaleX(" + ((cur+1)/SLIDES.length) + ")";
    stage.scrollTop = 0;
  }
  $("[data-prev]",m).onclick = () => show(cur-1);
  $("[data-next]",m).onclick = () => show(cur+1);
  const fsBtn = $("[data-fs]",m);
  fsBtn.onclick = () => {
    if(document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
  };
  addEventListener("fullscreenchange", () => {
    const on = !!document.fullscreenElement;
    document.body.classList.toggle("presenting", on);
    fsBtn.textContent = on ? "✕ Quitter" : "⛶ Plein écran";
  });
  addEventListener("keydown", e => {
    if(m.hidden) return;
    if(e.key === "ArrowRight" || e.key === "PageDown" || e.key === " "){ e.preventDefault(); show(cur+1); }
    if(e.key === "ArrowLeft"  || e.key === "PageUp"){ e.preventDefault(); show(cur-1); }
    if(e.key.toLowerCase() === "f") fsBtn.click();
  });
  show(0);
})();

   NAVIGATION + SOURCES

  {t:"IRM 7 teslas d'un cerveau humain ex vivo, résolution 100 µm, coupes horizontale, de face et de profil (Edlow B.L. et al., 2019) — CC0, domaine public", u:"https://commons.wikimedia.org/wiki/File:7_Tesla_MRI_of_the_ex_vivo_human_brain_at_100_micron_resolution_(100_micron_MRI_acquired_FA25_sagittal).webm"},
  {t:"Cerveau humain, photographie des National Institutes of Health — domaine public", u:"https://commons.wikimedia.org/wiki/File:Human_brain_NIH.jpg"},
  {t:"Photographie de cerveau de profil utilisée dans les blocs 5 et 5 bis : fournie pour ce projet, licence à vérifier avant toute publication", u:""}
];
$("#imglist").innerHTML = IMAGES.map(i =>
  '<li>'+i.t+(i.u ? ', <a href="'+i.u+'" target="_blank" rel="noopener">lien</a>' : '')+'</li>').join("");

function goto(page){
  $("#page-explorer").hidden = page !== "explorer";
  $("#page-presentation").hidden = page !== "presentation";
  $("#page-mots").hidden = page !== "mots";
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.page === page));
  if(location.hash.slice(1) !== page) history.replaceState(null,"","#"+page);
  scrollTo({top:0, behavior:"instant"});
}
document.querySelectorAll(".tab").forEach(t => t.onclick = () => goto(t.dataset.page));
buildGloss();
const h0 = location.hash.slice(1);
goto(h0 === "presentation" || h0 === "mots" ? h0 : "explorer");
</script>
